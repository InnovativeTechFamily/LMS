name: .NET Server CI

# Builds and tests the .NET 8 server (server-dotnet). Unit tests run on every push;
# the slower integration tests run on pull requests (pre-merge) and on demand.
on:
  push:
    branches: [main, dev, "feature/**"]
    paths:
      - "server-dotnet/**"
      - ".github/workflows/dotnet-server.yml"
  pull_request:
    paths:
      - "server-dotnet/**"
      - ".github/workflows/dotnet-server.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: server-dotnet

jobs:
  unit-tests:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The app targets net8.0; the test projects target net9.0. Install both runtimes/SDKs.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore LMS.sln

      - name: Build
        run: dotnet build LMS.sln --configuration Release --no-restore

      - name: Unit tests
        run: >-
          dotnet test tests/LMS.UnitTests/LMS.UnitTests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=unit-tests.trx"

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: server-dotnet/tests/LMS.UnitTests/TestResults/*.trx
          if-no-files-found: ignore

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: unit-tests
    # Run the slower, host-booting tests pre-merge (PRs) or when triggered manually.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore LMS.sln

      - name: Build
        run: dotnet build LMS.sln --configuration Release --no-restore

      - name: Integration tests
        run: >-
          dotnet test tests/LMS.IntegrationTests/LMS.IntegrationTests.csproj
          --configuration Release --no-build
          --logger "trx;LogFileName=integration-tests.trx"

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: server-dotnet/tests/LMS.IntegrationTests/TestResults/*.trx
          if-no-files-found: ignore
