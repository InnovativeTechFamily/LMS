<!DOCTYPE html>
<html>
<body style="font-family: Arial, sans-serif; color: #111;">
  <h2>Hello {{user.name}},</h2>
  <p>Thank you for registering. Please use the activation code below to verify your account:</p>
  <p style="font-size: 24px; font-weight: bold; letter-spacing: 4px;">{{activationCode}}</p>
  <p>This code is valid for 5 minutes.</p>
  <p>If you did not create this account, you can safely ignore this email.</p>
</body>
</html>
