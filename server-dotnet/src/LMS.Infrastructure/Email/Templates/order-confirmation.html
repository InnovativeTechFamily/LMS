<!DOCTYPE html>
<html>
<body style="font-family: Arial, sans-serif; color: #111;">
  <h2>Thank you for your purchase!</h2>
  <p>Your order has been confirmed.</p>
  <table style="border-collapse: collapse;">
    <tr><td style="padding: 4px 12px;"><strong>Order ID</strong></td><td style="padding: 4px 12px;">{{order._id}}</td></tr>
    <tr><td style="padding: 4px 12px;"><strong>Course</strong></td><td style="padding: 4px 12px;">{{order.name}}</td></tr>
    <tr><td style="padding: 4px 12px;"><strong>Price</strong></td><td style="padding: 4px 12px;">{{order.price}}</td></tr>
    <tr><td style="padding: 4px 12px;"><strong>Date</strong></td><td style="padding: 4px 12px;">{{order.date}}</td></tr>
  </table>
  <p>Enjoy your learning!</p>
</body>
</html>
